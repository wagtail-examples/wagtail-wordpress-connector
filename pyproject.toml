[project]
name = "wagtail-wordpress-connector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.3",
    "django>=4.2",
    "django-extensions>=3.2.3",
    "jmespath>=1.0.1",
    "requests>=2.32.3",
    "rich-click>=1.8.6",
    "wagtail>=6.4",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "coverage>=7.6.12",
    "flake8>=7.1.2",
    "isort>=6.0.1",
    "pre-commit>=4.1.0",
    "responses>=0.25.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.scripts]
wp = "commands.cli:wp"
wt = "commands.cli:wt"
dj = "commands.cli:dj"

i = "commands.inspector:i"
a = "commands.anchor_links:a"
