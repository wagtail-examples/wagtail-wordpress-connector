[project]
name = "wagtail-wordpress-connector"
version = "0.1.0"
description = "This is an experimental project to import WordPress content including pages and posts into Wagtail."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.3",
    "django>=5.2",
    "django-extensions>=3.2.3",
    "jmespath>=1.0.1",
    "requests>=2.32.3",
    "wagtail>=7.0",
]

[dependency-groups]
dev = [
    "colorama>=0.4.6",
    "coverage>=7.6.12",
    "pre-commit>=4.1.0",
    "responses>=0.25.6",
    "ruff>=0.11.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
