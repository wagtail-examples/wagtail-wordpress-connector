[project]
name = "wagtail-wordpress-connector"
version = "0.1.0"
description = "This is an experimental project to import WordPress content including pages and posts into Wagtail."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.3",
    "django>=5.2",
    "django-extensions>=3.2.3",
    "jmespath>=1.0.1",
    "requests>=2.32.3",
    "rich-click>=1.8.6",
    "wagtail>=7.0",
]

[dependency-groups]
dev = [
    "coverage>=7.6.12",
    "pre-commit>=4.1.0",
    "responses>=0.25.6",
    "ruff>=0.11.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.scripts]
go = "commands.cli:go"
wp = "commands.cli:wp"
wt = "commands.cli:wt"
dj = "commands.cli:dj"

i = "commands.inspector:i"
a = "commands.anchor_links:a"
